name: docs

# Every check, on every push and pull request; also the gate in front of a release
# (release.yml calls it on the tagged commit):
#   - build: Astro builds the site; starlight-links-validator fails on any broken internal
#     link or anchor; Pagefind indexes it.
#   - links: lychee checks the external links in the built site.
#   - browsers: Chromium and WebKit, light and dark, desktop and phone: no console errors and
#     no page that scrolls sideways on a phone.
#   - examples: every code block marked `test` runs against a real hardcharger-server from
#     Hardcharger's main branch, with the real clients (Python, Go, Java, Node, the CLI, curl),
#     PostgreSQL, Docker and nginx. Missing prerequisites FAIL the job; nothing is skipped.
#   - reference: the generated reference (configuration, SQL settings and functions, metrics,
#     CLI help, release notes, the Chargewire spec) is regenerated from that server and those
#     repositories and must match what is committed.
#
# Access, with no personal token and no deploy key:
#   - ghcr.io/gizmodata/hardcharger (:main for the server and the CLI, :latest for the Docker
#     examples), pulled with this workflow's GITHUB_TOKEN: the package grants this repository
#     read access (package settings, Manage Actions access).
#   - the source repositories (hardcharger for the CHANGELOG and the Python server package,
#     chargewire for the spec, hardcharger-adbc for the Python and Go driver, hardcharger-jdbc
#     and its chargewire-jdbc submodule for the JDBC driver) are public and cloned anonymously;
#     Go fetches its modules the same way. The JavaScript driver is installed from npm at the
#     version pinned in package-lock.json.
#   - Release downloads (the installer, tarballs, the Python package's server) are exercised
#     against a release mirror made from the :main image (verify_examples.py, `release`).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      ga:
        description: "Build and test the public site (as if the repository variable DOCS_GA were true)"
        type: boolean
        default: false
  workflow_call:

permissions:
  contents: read
  packages: read

# "docs-" keeps this group apart from release.yml's when release calls this workflow: there
# github.workflow is the caller's name, and a called workflow with its caller's group deadlocks.
concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  # The server the examples and the reference run against: Hardcharger's main branch, which
  # CI there publishes on every green push. Pin a :sha-<short> tag to reproduce an old run.
  HARDCHARGER_IMAGE: ghcr.io/gizmodata/hardcharger:main
  # The one switch between the private preview and the public site (README, "Private preview
  # and GA"): the repository variable DOCS_GA, or the `ga` input of a run started by hand.
  # With it the build has no preview banner, asides or noindex, sits at the custom domain, and
  # the examples inside <Ga> run and those inside <Preview> don't.
  DOCS_GA: ${{ (inputs.ga || vars.DOCS_GA == 'true') && 'true' || 'false' }}
  DOCS_SITE: ${{ (inputs.ga || vars.DOCS_GA == 'true') && 'https://docs.hardcharger.gizmodata.com' || 'https://curly-adventure-gke7ezg.pages.github.io' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build (fails on broken internal links)
        run: npm run build
      - name: The public site (DOCS_GA=true) has nothing of the preview left in it
        env:
          GA_SITE: https://docs.hardcharger.gizmodata.com
        run: |
          # Proves the switch on every push, before it is flipped: a second build with it on
          # (or this build, when it is on already), checked by scripts/check_ga_build.py.
          if [ "$DOCS_GA" = true ]; then
            out=dist
          else
            out=dist-ga
            DOCS_GA=true DOCS_SITE="$GA_SITE" npm run build -- --outDir "$out"
          fi
          python3 scripts/check_ga_build.py "$out"
      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: dist
          retention-days: 30

  links:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: dist
      - name: External links
        uses: lycheeverse/lychee-action@v2
        with:
          # gizmodata's repositories, packages and releases are internal until GA: an anonymous
          # check gets 404 (96 links in a dry run), so they are left out until the repository
          # variable is flipped; the `ga` input of a dry run doesn't change that.
          args: --config lychee.toml ${{ vars.DOCS_GA != 'true' && '--exclude ^https://github.com/gizmodata/' || '' }} --root-dir "${{ github.workspace }}/dist" "dist/**/*.html"
          fail: true

  browsers:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: dist
      - name: Chromium and WebKit, light and dark, desktop and phone
        run: |
          npx astro preview --port 4329 > preview.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:4329/ > /dev/null && break; sleep 1; done
          node scripts/screenshots.mjs screenshots
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screenshots
          path: screenshots

  examples:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: hardcharger
          POSTGRES_PASSWORD: hardcharger
          POSTGRES_DB: hardcharger
        ports: ["127.0.0.1:55450:5432"]
        options: >-
          --health-cmd "pg_isready -U hardcharger" --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      HARDCHARGER_DOCS_PG_URI: postgresql://hardcharger:hardcharger@127.0.0.1:55450/postgres
      GOPRIVATE: github.com/gizmodata/*
    steps:
      - uses: actions/checkout@v7
      - name: Source repositories
        env:
          # Main now contains the 2.0 driver, including Chargewire 1.0 partitioned ingest,
          # connection profiles and session handoff, tested against the server's main image.
          # Switch to the published wheel at the public release.
          HARDCHARGER_ADBC_REF: main
        run: |
          for repo in hardcharger chargewire hardcharger-adbc hardcharger-jdbc; do
            ref=()
            if [ "$repo" = hardcharger-adbc ]; then ref=(--branch "$HARDCHARGER_ADBC_REF"); fi
            git clone --quiet --depth 1 "${ref[@]}" --recurse-submodules --shallow-submodules \
              "https://github.com/gizmodata/$repo.git" "$RUNNER_TEMP/src/$repo"
            echo "$repo at $(git -C "$RUNNER_TEMP/src/$repo" rev-parse --short HEAD)"
          done

      - name: hardcharger-server and hardcharger from ${{ env.HARDCHARGER_IMAGE }}
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin > /dev/null
          if ! docker pull -q "$HARDCHARGER_IMAGE"; then
            echo "::error::can't pull $HARDCHARGER_IMAGE with this workflow's GITHUB_TOKEN: grant $GITHUB_REPOSITORY read access to the hardcharger package (package settings, Manage Actions access)"
            exit 1
          fi
          id=$(docker create "$HARDCHARGER_IMAGE")
          docker cp "$id:/opt/hardcharger" "$RUNNER_TEMP/hardcharger"
          docker rm "$id" > /dev/null
          "$RUNNER_TEMP/hardcharger/bin/hardcharger-server" --version
          test -x "$RUNNER_TEMP/hardcharger/bin/hardcharger"
          echo "HARDCHARGER_DOCS_BIN_DIR=$RUNNER_TEMP/hardcharger/bin" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ runner.temp }}/src/hardcharger-adbc/go/go.mod
          cache: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      # setup-java's own Maven cache looks for pom.xml only inside the workspace, and the
      # JDBC sources are cloned under $RUNNER_TEMP, so the cache is keyed here instead.
      - name: Maven cache key
        id: maven-key
        run: |
          key=$(find "$RUNNER_TEMP/src/hardcharger-jdbc" -name pom.xml -not -path '*/target/*' \
            -print0 | sort -z | xargs -0 cat | sha256sum | cut -c1-16)
          [ -n "$key" ] || exit 1
          echo "key=$key" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ steps.maven-key.outputs.key }}
          restore-keys: maven-${{ runner.os }}-
      - name: Tools
        run: sudo apt-get update -q && sudo apt-get install -y -q jq postgresql-client

      - name: The Python driver (adbc-driver-hardcharger) and the server package
        run: |
          adbc="$RUNNER_TEMP/src/hardcharger-adbc"
          (cd "$adbc/go" && CGO_ENABLED=1 go build -tags driverlib -buildmode=c-shared \
            -o ../python/src/adbc_driver_hardcharger/libadbc_driver_hardcharger.so ./pkg/hardcharger)
          python -m venv .venv
          .venv/bin/pip install -q "$adbc/python" "$RUNNER_TEMP/src/hardcharger/python" \
            pyyaml pexpect pyjwt cryptography

      - name: The published JavaScript driver (installed by npm ci)
        run: |
          npm ls @gizmodata/hardcharger @gizmodata/chargewire apache-arrow
          node --input-type=module -e 'import { parseUrl } from "@gizmodata/hardcharger"; console.log(parseUrl("hardcharger://localhost").href)'

      - name: The JDBC driver (hardcharger-jdbc.jar)
        run: |
          jdbc="$RUNNER_TEMP/src/hardcharger-jdbc"
          mvn -q -f "$jdbc/third_party/chargewire-jdbc/pom.xml" -DskipTests -DskipITs install
          mvn -q -f "$jdbc/pom.xml" -DskipTests package
          echo "HARDCHARGER_DOCS_JDBC_JAR=$jdbc/target/hardcharger-jdbc.jar" >> "$GITHUB_ENV"

      - name: Reference matches the server
        env:
          HARDCHARGER_DOCS_HARDCHARGER_SRC: ${{ runner.temp }}/src/hardcharger
          HARDCHARGER_DOCS_CHARGEWIRE_SRC: ${{ runner.temp }}/src/chargewire
        run: .venv/bin/python scripts/gen_reference.py --check

      - name: Every tested example
        run: |
          # The examples run with their own HOME; Docker and Go keep using the runner's. Their PATH
          # is built from scratch, so it is given the toolchains set up above (setup-go's Go, not
          # the image's older one, which can't build modules that need a newer Go).
          export DOCKER_CONFIG="$HOME/.docker" GOMODCACHE="$(go env GOMODCACHE)" GOCACHE="$(go env GOCACHE)"
          export HARDCHARGER_DOCS_EXTRA_PATH="$(go env GOROOT)/bin:$(dirname "$(command -v node)"):$JAVA_HOME/bin"
          .venv/bin/python scripts/verify_examples.py
