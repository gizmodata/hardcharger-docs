name: docs

# Every check, on every push and pull request; also the gate in front of a release
# (release.yml calls it on the tagged commit):
#   - build: Astro builds the site; starlight-links-validator fails on any broken internal
#     link or anchor; Pagefind indexes it.
#   - links: lychee checks the external links in the built site.
#   - browsers: Chromium and WebKit, light and dark, desktop and phone: no console errors and
#     no page that scrolls sideways on a phone.
#   - examples: every code block marked `test` runs against a real hardcharger-server from
#     Hardcharger's main branch, with the real clients (Python, Go, Java, Node, the CLI, curl),
#     PostgreSQL, Docker and nginx. Missing prerequisites FAIL the job; nothing is skipped.
#   - reference: the generated reference (configuration, SQL settings and functions, metrics,
#     CLI help, release notes, the Warp SQL spec) is regenerated from that server and those
#     repositories and must match what is committed.
#
# Access while Hardcharger is internal, with no personal token:
#   - ghcr.io/gizmodata/hardcharger (:main for the server and the CLI, :latest for the Docker
#     examples), pulled with this workflow's GITHUB_TOKEN: the package grants this repository
#     read access (package settings, Manage Actions access).
#   - the internal repositories, each through a read-only deploy key of that repository, kept
#     here as a secret: DEPLOY_KEY_HARDCHARGER (CHANGELOG, the Python server package),
#     DEPLOY_KEY_WARP_SQL (the spec), DEPLOY_KEY_HARDCHARGER_ADBC and DEPLOY_KEY_WARP_SQL_ADBC
#     (the Python and Go driver; Go fetches both modules), DEPLOY_KEY_HARDCHARGER_JDBC and
#     DEPLOY_KEY_WARP_SQL_JDBC (the JDBC driver and its submodule), DEPLOY_KEY_WARP_SQL_JS (the
#     JavaScript client).
#   - Release downloads (the installer, tarballs, the Python package's server) are exercised
#     against a release mirror made from the :main image (verify_examples.py, `release`).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  # The server the examples and the reference run against: Hardcharger's main branch, which
  # CI there publishes on every green push. Pin a :sha-<short> tag to reproduce an old run.
  HARDCHARGER_IMAGE: ghcr.io/gizmodata/hardcharger:main
  DOCS_SITE: https://curly-adventure-gke7ezg.pages.github.io

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build (fails on broken internal links)
        run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: dist
          retention-days: 30

  links:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: dist
      - name: External links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --config lychee.toml --root-dir "${{ github.workspace }}/dist" "dist/**/*.html"
          fail: true

  browsers:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: dist
      - name: Chromium and WebKit, light and dark, desktop and phone
        run: |
          npx astro preview --port 4329 > preview.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:4329/ > /dev/null && break; sleep 1; done
          node scripts/screenshots.mjs screenshots
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screenshots
          path: screenshots

  examples:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: hardcharger
          POSTGRES_PASSWORD: hardcharger
          POSTGRES_DB: hardcharger
        ports: ["127.0.0.1:55450:5432"]
        options: >-
          --health-cmd "pg_isready -U hardcharger" --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      HARDCHARGER_DOCS_PG_URI: postgresql://hardcharger:hardcharger@127.0.0.1:55450/postgres
      GOPRIVATE: github.com/gizmodata/*
    steps:
      - name: Deploy keys for the internal repositories
        env:
          DEPLOY_KEY_HARDCHARGER: ${{ secrets.DEPLOY_KEY_HARDCHARGER }}
          DEPLOY_KEY_WARP_SQL: ${{ secrets.DEPLOY_KEY_WARP_SQL }}
          DEPLOY_KEY_HARDCHARGER_ADBC: ${{ secrets.DEPLOY_KEY_HARDCHARGER_ADBC }}
          DEPLOY_KEY_WARP_SQL_ADBC: ${{ secrets.DEPLOY_KEY_WARP_SQL_ADBC }}
          DEPLOY_KEY_HARDCHARGER_JDBC: ${{ secrets.DEPLOY_KEY_HARDCHARGER_JDBC }}
          DEPLOY_KEY_WARP_SQL_JDBC: ${{ secrets.DEPLOY_KEY_WARP_SQL_JDBC }}
          DEPLOY_KEY_WARP_SQL_JS: ${{ secrets.DEPLOY_KEY_WARP_SQL_JS }}
        run: |
          # One SSH host alias per repository, each with its own key, and git rewrites every
          # spelling of that repository's URL (https, ssh, scp-like) to its alias. Go's module
          # fetches and git submodules go through the same rewrites.
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          for repo in hardcharger warp-sql hardcharger-adbc warp-sql-adbc hardcharger-jdbc warp-sql-jdbc warp-sql-js; do
            var="DEPLOY_KEY_$(echo "$repo" | tr 'a-z-' 'A-Z_')"
            key="${!var}"
            if [ -z "$key" ]; then
              echo "::error::the $var secret is not set: the private key of a read-only deploy key of gizmodata/$repo"
              exit 1
            fi
            printf '%s\n' "$key" > ~/.ssh/"$repo" && chmod 600 ~/.ssh/"$repo"
            printf 'Host github.com-%s\n  HostName github.com\n  User git\n  IdentityFile ~/.ssh/%s\n  IdentitiesOnly yes\n' "$repo" "$repo" >> ~/.ssh/config
            for from in "https://github.com/gizmodata/$repo" "ssh://git@github.com/gizmodata/$repo" "git@github.com:gizmodata/$repo"; do
              git config --global --add url."git@github.com-$repo:gizmodata/$repo".insteadOf "$from"
            done
          done

      - uses: actions/checkout@v7
      - name: Source repositories
        run: |
          for repo in hardcharger warp-sql hardcharger-adbc hardcharger-jdbc warp-sql-js; do
            git clone --quiet --depth 1 --recurse-submodules --shallow-submodules \
              "git@github.com:gizmodata/$repo.git" "$RUNNER_TEMP/src/$repo"
            echo "$repo at $(git -C "$RUNNER_TEMP/src/$repo" rev-parse --short HEAD)"
          done

      - name: hardcharger-server and hardcharger from ${{ env.HARDCHARGER_IMAGE }}
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin > /dev/null
          if ! docker pull -q "$HARDCHARGER_IMAGE"; then
            echo "::error::can't pull $HARDCHARGER_IMAGE with this workflow's GITHUB_TOKEN: grant $GITHUB_REPOSITORY read access to the hardcharger package (package settings, Manage Actions access)"
            exit 1
          fi
          id=$(docker create "$HARDCHARGER_IMAGE")
          docker cp "$id:/opt/hardcharger" "$RUNNER_TEMP/hardcharger"
          docker rm "$id" > /dev/null
          "$RUNNER_TEMP/hardcharger/bin/hardcharger-server" --version
          test -x "$RUNNER_TEMP/hardcharger/bin/hardcharger"
          echo "HARDCHARGER_DOCS_BIN_DIR=$RUNNER_TEMP/hardcharger/bin" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ runner.temp }}/src/hardcharger-adbc/go/go.mod
          cache: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Tools
        run: sudo apt-get update -q && sudo apt-get install -y -q jq postgresql-client

      - name: The Python driver (adbc-driver-hardcharger) and the server package
        run: |
          adbc="$RUNNER_TEMP/src/hardcharger-adbc"
          (cd "$adbc/go" && CGO_ENABLED=1 go build -tags driverlib -buildmode=c-shared \
            -o ../python/src/adbc_driver_hardcharger/libadbc_driver_hardcharger.so ./pkg/hardcharger)
          python -m venv .venv
          .venv/bin/pip install -q "$adbc/python" "$RUNNER_TEMP/src/hardcharger/python" \
            pyyaml pexpect pyjwt cryptography

      - name: The JavaScript client (@gizmodata/warp-sql, not on npm yet)
        run: |
          js="$RUNNER_TEMP/src/warp-sql-js"
          (cd "$js" && npm ci --silent && npm run build --silent && npm pack --silent --pack-destination "$RUNNER_TEMP")
          npm install --no-save "$RUNNER_TEMP"/gizmodata-warp-sql-*.tgz

      - name: The JDBC driver (hardcharger-jdbc.jar)
        run: |
          jdbc="$RUNNER_TEMP/src/hardcharger-jdbc"
          mvn -q -f "$jdbc/third_party/warp-sql-jdbc/pom.xml" -DskipTests -DskipITs install
          mvn -q -f "$jdbc/pom.xml" -DskipTests package
          echo "HARDCHARGER_DOCS_JDBC_JAR=$jdbc/target/hardcharger-jdbc.jar" >> "$GITHUB_ENV"

      - name: Reference matches the server
        env:
          HARDCHARGER_DOCS_HARDCHARGER_SRC: ${{ runner.temp }}/src/hardcharger
          HARDCHARGER_DOCS_WARPSQL_SRC: ${{ runner.temp }}/src/warp-sql
        run: .venv/bin/python scripts/gen_reference.py --check

      - name: Every tested example
        run: |
          # The examples run with their own HOME; Docker and Go keep using the runner's.
          export DOCKER_CONFIG="$HOME/.docker" GOMODCACHE="$(go env GOMODCACHE)" GOCACHE="$(go env GOCACHE)"
          .venv/bin/python scripts/verify_examples.py
