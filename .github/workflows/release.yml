name: release

# On a vX.Y.Z tag (or by hand): every check of docs.yml on the tagged commit, then a GitHub
# Release with that version's CHANGELOG section and the built site, and the site deployed to
# GitHub Pages (private to the organization until launch; see README).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# A deploy is never cut off halfway: a second run waits for the first.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    uses: ./.github/workflows/docs.yml
    permissions:
      contents: read
      packages: read
    secrets: inherit

  build:
    needs: tests
    runs-on: ubuntu-24.04
    env:
      DOCS_SITE: https://curly-adventure-gke7ezg.pages.github.io
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - name: Site tarball
        run: tar -czf hardcharger-docs-site.tar.gz -C dist .
      - uses: actions/upload-artifact@v7
        with:
          name: site-tarball
          path: hardcharger-docs-site.tar.gz

  github-release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: site-tarball
      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "::error::CHANGELOG.md has no section for $version"; exit 1; }
      - uses: softprops/action-gh-release@v3
        with:
          body_path: notes.md
          files: hardcharger-docs-site.tar.gz

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
