# External link check for the built site (docs.yml, job "links"). Internal links and anchors
# are checked at build time by starlight-links-validator.

max_retries = 3
retry_wait_time = 5
timeout = 30
# Some sites refuse bots (403) or rate-limit (429). GitHub answers bulk requests for its file pages
# (github.com/<org>/<repo>/blob/...) with 503 when it throttles the runner: since the docs went public
# (DOCS_GA, 2026-11-17) those links are checked, and 503s on links that load fine failed three release
# runs in an hour (2.13.1.post4 and post5). A 503 is "temporarily unavailable", not a broken link;
# 404 and 410 still fail.
accept = ["200..=299", "403", "429", "503"]

exclude = [
  # gizmodata's repositories are excluded by docs.yml while they are internal (DOCS_GA unset).
  # The docs' own address, and the private preview's.
  '^https://docs\.hardcharger\.gizmodata\.com',
  '^https://curly-adventure-gke7ezg\.pages\.github\.io',
  # Example hosts in prose.
  '^https?://(localhost|127\.0\.0\.1)',
  '\.example\.(com|org)',
  # Badge images.
  '^https://img\.shields\.io/',
]
exclude_path = ["dist/pagefind", "dist/_astro"]
